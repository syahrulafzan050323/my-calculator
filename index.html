<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definite Integral Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f7;
            color: #333;
            display: flex;
            justify-content: center;
        }
        .container {
            display: flex;
            flex-direction: row;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 1100px;
            overflow: hidden;
        }
        .sidebar {
            width: 35%;
            padding: 25px;
            background-color: #fafafa;
            border-right: 1px solid #e5e5e7;
            box-sizing: border-box;
        }
        .graph-container {
            width: 65%;
            padding: 20px;
            position: relative;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h2 {
            margin-top: 0;
            color: #1d1d1f;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #515154;
            font-size: 14px;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #0071e3;
        }
        .result-box {
            margin-top: 30px;
            padding: 15px;
            background-color: #e8f4fd;
            border-left: 4px solid #0071e3;
            border-radius: 4px;
        }
        .result-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #0071e3;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .result-value {
            font-size: 24px;
            font-weight: bold;
            color: #1d1d1f;
        }
        .error {
            color: #df1c1c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar, .graph-container {
                width: 100%;
            }
            .sidebar {
                border-right: none;
                border-bottom: 1px solid #e5e5e7;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>Integration Controls</h2>
        
        <div class="input-group">
            <label for="function-input">Function f(x)</label>
            <input type="text" id="function-input" value="x^2 - 2x + 1">
        </div>

        <div class="input-group">
            <label for="limit-a">Lower Limit (a)</label>
            <input type="number" id="limit-a" value="0" step="any">
        </div>

        <div class="input-group">
            <label for="limit-b">Upper Limit (b)</label>
            <input type="number" id="limit-b" value="3" step="any">
        </div>

        <div class="input-group">
            <label for="intervals">Intervals (n) for Approximation</label>
            <input type="number" id="intervals" value="100" min="10" max="1000">
        </div>

        <div id="error-message" class="error">Invalid Expression</div>

        <div class="result-box">
            <div class="result-title">Definite Integral Value</div>
            <div id="result" class="result-value">0.0000</div>
        </div>
    </div>

    <div class="graph-container">
        <canvas id="myChart"></canvas>
    </div>
</div>

<script>
    let myChart = null;

    // Helper function to safely parse and evaluate the math expression
    function evaluateMath(expr, xValue) {
        return math.evaluate(expr, { x: xValue });
    }

    function updateCalculator() {
        const exprInput = document.getElementById('function-input').value;
        const a = parseFloat(document.getElementById('limit-a').value);
        const b = parseFloat(document.getElementById('limit-b').value);
        const n = parseInt(document.getElementById('intervals').value) || 100;
        const errorDiv = document.getElementById('error-message');
        const resultDiv = document.getElementById('result');

        errorDiv.style.display = 'none';

        try {
            // Test if expression is valid
            evaluateMath(exprInput, 1);
        } catch (e) {
            errorDiv.style.display = 'block';
            errorDiv.innerText = "Error: Invalid mathematical expression.";
            return;
        }

        if (isNaN(a) || isNaN(b)) return;

        // 1. Calculate the Integral using the Trapezoidal Rule
        let integralSum = 0;
        const dx = (b - a) / n;
        
        if (n > 0 && a !== b) {
            let sum = 0.5 * (evaluateMath(exprInput, a) + evaluateMath(exprInput, b));
            for (let i = 1; i < n; i++) {
                let x = a + i * dx;
                sum += evaluateMath(exprInput, x);
            }
            integralSum = sum * dx;
        }
        
        // Display result rounded to 4 decimal places
        resultDiv.innerText = integralSum.toFixed(4);

        // 2. Generate Data for Graphing
        // We expand the graph slightly outside [a, b] for better context
        const padding = Math.max(Math.abs(b - a) * 0.5, 2);
        const startX = Math.min(a, b) - padding;
        const endX = Math.max(a, b) + padding;
        
        const mainLineData = [];
        const shadedData = [];
        const steps = 150; 
        const stepSize = (endX - startX) / steps;

        for (let i = 0; i <= steps; i++) {
            let x = startX + (i * stepSize);
            try {
                let y = evaluateMath(exprInput, x);
                if (!isNaN(y) && isFinite(y)) {
                    mainLineData.push({x: x, y: y});
                }
            } catch(e){}
        }

        // Shaded data structure strictly between limits 'a' and 'b'
        const minLimit = Math.min(a, b);
        const maxLimit = Math.max(a, b);
        const shadeSteps = 100;
        const shadeStepSize = (maxLimit - minLimit) / shadeSteps;

        for (let i = 0; i <= shadeSteps; i++) {
            let x = minLimit + (i * shadeStepSize);
            try {
                let y = evaluateMath(exprInput, x);
                if (!isNaN(y) && isFinite(y)) {
                    shadedData.push({x: x, y: y});
                }
            } catch(e){}
        }

        // 3. Render or Update Chart.js
        const ctx = document.getElementById('myChart').getContext('2d');

        if (myChart) {
            myChart.data.datasets[0].data = mainLineData;
            myChart.data.datasets[1].data = shadedData;
            myChart.update('none'); // Update without animation lag during text typing
        } else {
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: `f(x) = ${exprInput}`,
                            data: mainLineData,
                            borderColor: '#0071e3',
                            borderWidth: 2.5,
                            pointRadius: 0,
                            fill: false,
                            tension: 0.1
                        },
                        {
                            label: 'Integrated Area',
                            data: shadedData,
                            backgroundColor: 'rgba(0, 113, 227, 0.25)',
                            borderColor: 'transparent',
                            pointRadius: 0,
                            fill: 'origin', // Fills down to y=0 line
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            grid: { color: '#e5e5e7' }
                        },
                        y: {
                            type: 'linear',
                            grid: { color: '#e5e5e7' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }
    }

    // Attach real-time input event listeners
    document.getElementById('function-input').addEventListener('input', updateCalculator);
    document.getElementById('limit-a').addEventListener('input', updateCalculator);
    document.getElementById('limit-b').addEventListener('input', updateCalculator);
    document.getElementById('intervals').addEventListener('input', updateCalculator);

    // Initial load execution
    window.onload = updateCalculator;
</script>

</body>
</html>
